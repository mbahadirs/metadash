<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#6E5CF0"/>
      <stop offset="1" stop-color="#C06CE8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- bars -->
  <rect x="268" y="560" width="104" height="196" rx="30" fill="#FFFFFF" fill-opacity="0.72"/>
  <rect x="460" y="452" width="104" height="304" rx="30" fill="#FFFFFF" fill-opacity="0.86"/>
  <rect x="652" y="336" width="104" height="420" rx="30" fill="#FFFFFF"/>
  <!-- trend line -->
  <path d="M292 452 L512 346 L704 238" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="704" cy="238" r="44" fill="#FFFFFF"/>
</svg>
