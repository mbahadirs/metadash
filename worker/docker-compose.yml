# MetaDash worker. Put the .env generated by MetaDash (Settings → Publishing → Self-hosted worker) next to this file.
#   docker compose up -d                       worker only (private network / Tailscale / LAN)
#   docker compose --profile https up -d       worker + Caddy with automatic HTTPS (set MD_DOMAIN and MD_PUBLIC_URL)
services:
  worker:
    image: ghcr.io/mbahadirs/metadash-worker:latest
    # build: { context: .., dockerfile: worker/Dockerfile }   # to build from a checkout instead
    restart: unless-stopped
    env_file: .env
    environment:
      MD_DATA_DIR: /data
    volumes:
      - worker-data:/data
    ports:
      # Bound to localhost by default; change to "8787:8787" only on a trusted private network.
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [worker]
    environment:
      MD_DOMAIN: ${MD_DOMAIN:-worker.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  worker-data:
  caddy-data:
  caddy-config:
