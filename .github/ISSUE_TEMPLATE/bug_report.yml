name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MetaDash version
      description: Settings → About, or the release you downloaded.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message / logs
      description: Never paste your Meta access token or App Secret.
      render: text
